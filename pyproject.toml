[project]
name = "alfa-news-foundation"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.14,<2", "asyncpg>=0.30,<1",
  "uvicorn>=0.34,<1", "jinja2>=3.1,<4", "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[project.optional-dependencies]
ml = ["pypdfium2==4.30.0", "pytesseract==0.3.13", "Pillow==11.1.0",
      "numpy==2.2.6", "sentence-transformers==4.1.0", "transformers==4.51.3",
      "torch==2.7.1+cpu", "PySocks==1.7.1"]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["contracts", "app/core", "app/llm", "app/budgets"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: isolated PostgreSQL database", "e2e: HTTP with separate API and worker"]
